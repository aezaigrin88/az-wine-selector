name: Sync Vivino Wine Atlas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run bidirectional Vivino sync
        env:
          VIVINO_EMAIL: ${{ secrets.VIVINO_EMAIL }}
          VIVINO_PASSWORD: ${{ secrets.VIVINO_PASSWORD }}
          VIVINO_COOKIE: ${{ secrets.VIVINO_COOKIE }}
        run: python sync_vivino.py --bidirectional

      - name: Commit updated wines_data.json if changed
        run: |
          git config user.name "AZ Wine Selector Bot"
          git config user.email "ae.zaigrin@gmail.com"
          git add wines_data.json img/
          if ! git diff --staged --quiet; then
            git commit -m "chore(vivino): sync cellar #6491870 with wines_data.json"
            git pull --rebase origin main
            git push origin main
          fi
